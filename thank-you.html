<!DOCTYPE html>
<html lang="en">
<head>
    
  <meta name="robots" content="noindex, nofollow">    
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Thank You | Essex Builders</title>
  <meta name="robots" content="noindex, follow" />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700;900&family=DM+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    :root{--navy:#1a2b5f;--accent:#2563eb;--gold:#c9a84c;--light:#f5f7fb;--white:#fff;--text:#1e293b;--muted:#64748b;--border:#e2e8f0}
    body{font-family:'DM Sans',sans-serif;color:var(--text);background:var(--light);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:28px}
    .card{max-width:720px;background:var(--white);border:1px solid var(--border);border-radius:22px;padding:54px;box-shadow:0 18px 50px rgba(26,43,95,.12);text-align:center}
    .tag{display:inline-flex;align-items:center;gap:8px;font-size:.75rem;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--accent);margin-bottom:18px}
    .tag span{width:28px;height:2px;background:var(--accent);display:inline-block}
    h1{font-family:'Playfair Display',serif;color:var(--navy);font-size:clamp(2.2rem,5vw,3.4rem);line-height:1.08;margin-bottom:16px}
    p{color:var(--muted);line-height:1.75;margin-bottom:28px}
    .actions{display:flex;gap:14px;justify-content:center;flex-wrap:wrap}
    a{display:inline-flex;align-items:center;justify-content:center;padding:13px 24px;border-radius:8px;font-weight:700;text-decoration:none;transition:.2s}
    .primary{background:var(--navy);color:var(--white)}.primary:hover{background:var(--accent);transform:translateY(-2px)}
    .outline{border:2px solid var(--navy);color:var(--navy)}.outline:hover{background:var(--navy);color:var(--white)}
  </style>
</head>
<body>
  <main class="card">
    <div class="tag"><span></span> Enquiry received</div>
    <h1>Thank You for Getting in Touch</h1>
    <p>Your message has been sent to Essex Builders. We’ll review your enquiry and get back to you as soon as possible. For urgent enquiries, please call us directly on 07958 355936.</p>
    <div class="actions">
      <a class="primary" href="index.html">Back to Home</a>
      <a class="outline" href="tel:07958355936">Call 07958 355936</a>
    </div>
  </main>
  
  <script src="cookie-consent.js"></script>
  
</body>
</html>
